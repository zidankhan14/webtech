<!DOCTYPE html>
<html>
<head>
    <title>Person Profile Assessment</title>
</head>
<body>
    <form>
        <table border="1" cellpadding="8" cellspacing="0" style="width: 550px; font-family: Arial, sans-serif;">
            <tr>
                <td colspan="3" align="center"><h2>PERSON PROFILE</h2></td>
            </tr>
            <tr>
                <td width="120">Name</td>
                <td><input type="text" name="full_name" style="width: 90%;"></td>
                <td width="30"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email" style="width: 90%;"></td>
                <td></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="g" value="m"> Male
                    <input type="radio" name="g" value="f"> Female
                    <input type="radio" name="g" value="o"> Other
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" size="2"> / 
                    <input type="text" size="2"> / 
                    <input type="text" size="4"> 
                    <small><i>(dd/mm/yyyy)</i></small>
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Blood Group</td>
                <td>
                    <select>
                        <option>A+</option>
                        <option>B+</option>
                    </select>
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Degree</td>
                <td>
                    <input type="checkbox"> SSC 
                    <input type="checkbox"> HSC 
                    <input type="checkbox"> BSc. 
                    <input type="checkbox"> MSc.
                </td>
                <td></td>
            </tr>
            <tr>
                <td>Photo</td>
                <td colspan="2">
                    <input type="file">
                </td>
            </tr>
            <tr>
                <td colspan="3" height="40"></td>
            </tr>
            <tr>
                <td colspan="3" align="right">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
