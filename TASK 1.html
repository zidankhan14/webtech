<!DOCTYPE html>
<html>
<head>
	<title>XYZ Restaurant</title>
</head>
<body>

			<tr>
				<th colspan="2">XYZ Restaurant</th>
			</tr>
			<tr>
				<th colspan="2">Menu</th>
			</tr>
			<tr>
				<th>Items</th>
				<th>Price</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>
					<ol start="1">

					<dl>
						<dd>Chicken, Beef, Capsicum, Cheese</dd>
					</dl>
				</td>
				<td>800</td>
			</tr>
			<tr>
				<td>
					<ol start="2">
						<li>Burger</li>
					</ol>
					<dl>

				</td>

			</tr>
			<tr>
				<td>
					<ol start="3">
						<li>Coffee</li>
					</ol>
					<dl>

					</dl>

				<td>200</td>
			</tr>

	</table>

</html>
